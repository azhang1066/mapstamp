openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: map-data
    description: User travel map data persistence.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /map-data:
    get:
      tags: [map-data]
      operationId: getMapData
      summary: Load the authenticated user's travel map data
      responses:
        '200':
          description: Map data loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDataEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [map-data]
      operationId: saveMapData
      summary: Save the authenticated user's travel map data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapDataPayload'
      responses:
        '200':
          description: Map data saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveMapDataResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MapDataPayload:
      type: object
      properties:
        visitedCountries:
          type: array
          items:
            type: string
        visitedStates:
          type: array
          items:
            type: string
        visitedProvinces:
          type: array
          items:
            type: string
        visitedStadiums:
          type: array
          items:
            type: string
        visitedParks:
          type: array
          items:
            type: string
        tccVisited:
          type: array
          items:
            type: string
        bucketCountries:
          type: array
          items:
            type: string
        bucketStates:
          type: array
          items:
            type: string
        bucketProvinces:
          type: array
          items:
            type: string
        bucketStadiums:
          type: array
          items:
            type: string
        bucketParks:
          type: array
          items:
            type: string
        tccBucket:
          type: array
          items:
            type: string
        countryDetails:
          type: object
          additionalProperties: true
        stateDetails:
          type: object
          additionalProperties: true
        provinceDetails:
          type: object
          additionalProperties: true
        stadiumDetails:
          type: object
          additionalProperties: true
        parkDetails:
          type: object
          additionalProperties: true
        tccDetails:
          type: object
          additionalProperties: true
        notesByKey:
          type: object
          additionalProperties:
            type: string
        profileName:
          type: string
    MapDataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/MapDataPayload'
            - type: 'null'
    SaveMapDataResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
