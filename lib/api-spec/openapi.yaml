openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: map-data
    description: User travel map data persistence.
  - name: photos
    description: Per-destination photo management.
  - name: stats
    description: Cross-user aggregate statistics (no auth required).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /map-data:
    get:
      tags: [map-data]
      operationId: getMapData
      summary: Load the authenticated user's travel map data
      responses:
        '200':
          description: Map data loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDataEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [map-data]
      operationId: saveMapData
      summary: Save the authenticated user's travel map data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapDataPayload'
      responses:
        '200':
          description: Map data saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveMapDataResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /photos:
    get:
      tags: [photos]
      operationId: listPhotos
      summary: List photos for a destination
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
          description: Destination category (country, state, province, tcc, etc.)
        - name: destinationId
          in: query
          required: true
          schema:
            type: string
          description: Destination identifier within its category.
      responses:
        '200':
          description: Photos listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoListResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [photos]
      operationId: uploadPhoto
      summary: Upload a photo for a destination (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, category, destinationId]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                destinationId:
                  type: string
                position:
                  type: integer
                  minimum: 0
                  maximum: 2
                caption:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: Photo uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoRecord'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /photos/{id}:
    patch:
      tags: [photos]
      operationId: updatePhoto
      summary: Update a photo's caption
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhotoBody'
      responses:
        '200':
          description: Photo updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoRecord'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Photo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [photos]
      operationId: deletePhoto
      summary: Delete a photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Photo deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePhotoResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Photo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /photos/{id}/content:
    get:
      tags: [photos]
      operationId: getPhotoContent
      summary: Stream photo binary content (auth-gated proxy)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Photo content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Photo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /stats/aggregate:
    get:
      tags: [stats]
      operationId: getAggregateStats
      summary: Most/least visited destinations per category
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [country, us_state, ca_province, tcc]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Aggregate stats returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateStatsResponse'
  /stats/destination/{category}/{id}:
    get:
      tags: [stats]
      operationId: getDestinationStats
      summary: Per-destination visit stats (e.g. "38% of users have visited Iceland")
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [country, us_state, ca_province, tcc]
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Destination stats returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationStatsResponse'
        '404':
          description: No data found for this destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MapDataPayload:
      type: object
      properties:
        schemaVersion:
          type: integer
          description: Schema version for forward-compatibility tracking.
        visitedCountries:
          type: array
          items:
            type: string
        visitedStates:
          type: array
          items:
            type: string
        visitedProvinces:
          type: array
          items:
            type: string
        visitedStadiums:
          type: array
          items:
            type: string
        visitedParks:
          type: array
          items:
            type: string
        tccVisited:
          type: array
          items:
            type: string
        bucketCountries:
          type: array
          items:
            type: string
        bucketStates:
          type: array
          items:
            type: string
        bucketProvinces:
          type: array
          items:
            type: string
        bucketStadiums:
          type: array
          items:
            type: string
        bucketParks:
          type: array
          items:
            type: string
        tccBucket:
          type: array
          items:
            type: string
        countryDetails:
          type: object
          additionalProperties: true
        stateDetails:
          type: object
          additionalProperties: true
        provinceDetails:
          type: object
          additionalProperties: true
        stadiumDetails:
          type: object
          additionalProperties: true
        parkDetails:
          type: object
          additionalProperties: true
        tccDetails:
          type: object
          additionalProperties: true
        notesByKey:
          type: object
          additionalProperties:
            type: string
        profileName:
          type: string
    MapDataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/MapDataPayload'
            - type: 'null'
    SaveMapDataResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    PhotoRecord:
      type: object
      required: [id, url, caption, position, createdAt]
      properties:
        id:
          type: string
          description: UUID of the photo record.
        url:
          type: string
          description: Relative URL to fetch the photo content, e.g. /api/photos/<id>/content.
        caption:
          type: string
          maxLength: 120
        position:
          type: integer
          minimum: 0
          maximum: 2
        createdAt:
          type: string
          format: date-time
    PhotoListResponse:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoRecord'
    UpdatePhotoBody:
      type: object
      properties:
        caption:
          type: string
          maxLength: 120
    DeletePhotoResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    DestinationStatEntry:
      type: object
      required: [destinationId, visitedCount, bucketCount]
      properties:
        destinationId:
          type: string
        visitedCount:
          type: integer
        bucketCount:
          type: integer
    AggregateStatsResponse:
      type: object
      required: [category, totalUsers, destinations]
      properties:
        category:
          type: string
        totalUsers:
          type: integer
          description: Total distinct users in the system.
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/DestinationStatEntry'
    DestinationStatsResponse:
      type: object
      required: [category, destinationId, visitedCount, bucketCount, totalUsers, visitedPct, bucketPct]
      properties:
        category:
          type: string
        destinationId:
          type: string
        visitedCount:
          type: integer
        bucketCount:
          type: integer
        totalUsers:
          type: integer
        visitedPct:
          type: number
          format: float
          description: Percentage of total users who have visited (0–100).
        bucketPct:
          type: number
          format: float
          description: Percentage of total users with this on their bucket list (0–100).
