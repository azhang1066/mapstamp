name: World Map browser tests

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-map-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-map-e2e:
    name: Public and authenticated map flows
    # GitHub does not expose repository secrets to forked pull requests. Do not
    # run this credentialed job against untrusted fork code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.WORLD_MAP_E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.WORLD_MAP_E2E_CLERK_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.WORLD_MAP_E2E_DATABASE_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.WORLD_MAP_E2E_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser runtime
        run: pnpm --filter @workspace/world-map exec playwright install --with-deps chromium

      - name: Run World Map end-to-end suite
        run: pnpm --filter @workspace/world-map run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-map-playwright-diagnostics
          path: |
            artifacts/world-map/test-results
            artifacts/world-map/playwright-report
          if-no-files-found: ignore
